[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-ai-trader"
version = "0.1.0"
description = "Research-grade AI trading core for Deriv synthetic indices."
requires-python = ">=3.11"
authors = [{ name = "Synthetic Indices Bot" }]
dependencies = []

[project.optional-dependencies]
live = ["websockets>=12.0"]
research = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4"]
dev = ["pytest>=8.0"]

[project.scripts]
synth-trader = "synthetic_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true
exclude = ["external/"]

[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "sklearn.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "synthetic_trader.research.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "synthetic_trader.observability"
ignore_errors = true

[[tool.mypy.overrides]]
module = "synthetic_trader.features.*"
ignore_missing_imports = true
